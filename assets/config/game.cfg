; ============================================================
; archmage - великий маг фракции (пакет 3.0)
; ============================================================
[archmage]
; decay_base/decay_threat - спад ЗА ОДИН ТИК, а тик идёт каждые
; sim_interval секунд. В сутках 86400/sim_interval тиков (при 20 с их
; 4320), поэтому спад в сутки = decay * 86400 / sim_interval.
;
; Проверено прогоном tests/sim_archmage_stakes.py на 100 и 1000 дней.
; Первая версия (0.02 + 0.06) давала 4.32 спада в сутки - фракция падала
; с 60 до 0 за 14 дней. Сейчас: 2.16 спада в сутки при угрозе 0,
; 8.64 при угрозе 1.0. Держать фракцию - 2.2 слитка в день при угрозе 0.
sim_interval = 20.0
decay_base = 0.0005
decay_threat = 0.0015

; Ставки платы. Зелье сильнее слитка намеренно: то, что нужно игроку,
; нужно и фракции - это и есть конфликт выбора. Точка баланса из прогона:
; 5 зелий в день доводят мага до 100.
stake_ingot = 1.0
stake_gold = 1.0
stake_potion = 1.5
gold_per_stake = 100

power_start = 60.0
power_max = 100.0
tier_1 = 35.0
tier_2 = 65.0
tier_3 = 90.0
